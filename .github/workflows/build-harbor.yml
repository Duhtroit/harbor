name: Build Harbor macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Harbor app
    # Harbor uses macOS 26 SwiftUI APIs such as glassEffect and ToolbarSpacer.
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -resolvePackageDependencies

      - name: Build Harbor
        run: |
          xcodebuild \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath build/HarborDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app bundle
        run: |
          test -d build/HarborDerivedData/Build/Products/Debug/Harbor.app
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            build/HarborDerivedData/Build/Products/Debug/Harbor.app/Contents/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            build/HarborDerivedData/Build/Products/Debug/Harbor.app/Contents/Info.plist

      - name: Package app
        run: |
          ditto \
            -c -k --sequesterRsrc --keepParent \
            build/HarborDerivedData/Build/Products/Debug/Harbor.app \
            Harbor-debug-macos.zip
          shasum -a 256 Harbor-debug-macos.zip > Harbor-debug-macos.zip.sha256

      - name: Upload Harbor app
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-debug-macos
          path: |
            Harbor-debug-macos.zip
            Harbor-debug-macos.zip.sha256
          if-no-files-found: error
          retention-days: 14
